name: Build fixed PHP images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile.blueprint-1151
            image: php2shell-blueprint-1151
          - dockerfile: Dockerfile.blueprint-1124
            image: php2shell-blueprint-1124
          - dockerfile: Dockerfile.pterodactyl-legacy
            image: php2shell-pterodactyl-legacy
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rh1te/${{ matrix.image }}:20261028
